name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Find and ZIP executable
        run: |
          Write-Host "=== Searching for .exe ==="
          $exe = Get-ChildItem -Recurse build/ -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "✅ Found: $($exe.FullName)"
            $dir = Split-Path $exe.FullName
            Write-Host "📁 Directory: $dir"
            
            # Create ZIP in root
            cd $dir
            Compress-Archive -Path * -DestinationPath ../../../../../pix_multi_final_windows.zip -Force
            cd ../../../../../
            
            # Verify ZIP exists
            if (Test-Path "pix_multi_final_windows.zip") {
              Write-Host "✅ ZIP created successfully!"
              Get-Item "pix_multi_final_windows.zip" | Select-Object Name, Length
            } else {
              Write-Host "❌ ZIP not found!"
              exit 1
            }
          } else {
            Write-Host "❌ No .exe found in build directory!"
            Get-ChildItem -Recurse build/ | Select-Object FullName
            exit 1
          }

      - name: Upload Windows ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pix_multi_final_windows
          path: pix_multi_final_windows.zip
          retention-days: 30
          if-no-files-found: error
