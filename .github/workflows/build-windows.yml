name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows executable
        run: flutter build windows --release --verbose

      - name: Create ZIP package
        run: |
          $releasePath = "build/windows/x64/runner/Release"
          if (Test-Path $releasePath) {
            Write-Host "✅ Found: $releasePath"
            cd $releasePath
            Compress-Archive -Path * -DestinationPath ../../../../../pix_multi_final_windows.zip -Force
            cd ../../../../../
            Write-Host "✅ ZIP created"
          } else {
            Write-Host "❌ Path not found, searching..."
            $exe = Get-ChildItem -Recurse build/ -Filter "*.exe" | Select-Object -First 1
            if ($exe) {
              Write-Host "✅ Found exe at: $($exe.FullName)"
              $dir = Split-Path $exe.FullName
              cd $dir
              Compress-Archive -Path * -DestinationPath ../../../../../pix_multi_final_windows.zip -Force
            } else {
              Write-Host "❌ No .exe found!"
              exit 1
            }
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: pix_multi_final_windows.zip
          tag_name: ${{ github.ref_name }}
          name: "PIX Multi ${{ github.ref_name }}"
          body: "Build automático do Windows executable"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
