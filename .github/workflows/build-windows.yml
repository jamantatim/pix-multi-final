name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows executable
        run: flutter build windows --release

      - name: Create ZIP package
        run: |
          # Listar conteúdo para debug
          Write-Host "=== Build directory contents ==="
          Get-ChildItem -Recurse build/windows/ | Select-Object FullName
    
          # Caminho correto para Flutter 3.27+
          $releasePath = "build/windows/x64/runner/Release"
    
          if (Test-Path $releasePath) {
            Write-Host "✅ Found release at: $releasePath"
            cd $releasePath
            Compress-Archive -Path * -DestinationPath ../../../../../pix_multi_final_windows.zip -Force
            cd ../../../../../
            Write-Host "✅ ZIP created: pix_multi_final_windows.zip"
          } else {
            Write-Host "❌ Release path not found: $releasePath"
            Write-Host "🔍 Searching for .exe file..."
            Get-ChildItem -Recurse build/ -Filter "*.exe" | Select-Object FullName
            exit 1
          }

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: pix_multi_final_windows.zip
          asset_name: pix_multi_final_windows.zip
          tag: ${{ github.ref }}
          overwrite: true
